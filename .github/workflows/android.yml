name: Android APK (debug)

# Build APK debug Noor dari branch native/capacitor.
# Hasilnya diunggah sebagai artifact "noor-debug-apk" (tab Actions).
on:
  workflow_dispatch:
  push:
    branches: [native/capacitor]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/android.yml'

jobs:
  build-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Siapkan JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang keystore debug tetap
        # Runner Actions selalu mesin baru -> tanpa keystore tetap, kunci
        # debug berganti tiap build dan Android menolak update ("paket
        # bentrok"). Keystore tetap disimpan sebagai secret repo
        # DEBUG_KEYSTORE_B64; AGP memakainya otomatis dari ~/.android/.
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > $HOME/.android/debug.keystore
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > android/app/noor-debug.keystore

      - name: Instal dependensi
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sinkronkan Capacitor (Android)
        run: npx cap sync android

      - name: Rakit APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Verifikasi tanda tangan tetap
        # Gagal keras bila sertifikat APK bukan kunci tetap yang
        # ditetapkan - mencegah APK berkunci acak terkirim lagi.
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          DIGEST=$($APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-F' 'a-f')
          echo "Sertifikat APK: $DIGEST"
          test "$DIGEST" = "5c4a058c355b92bf767b1c47dc774da7992a024415e076686991ffbe1b21342c"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
