<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- lengan baju emerald gelap di ujung siku -->
  <ellipse cx="128" cy="90" rx="11" ry="14" fill="#06312A" transform="rotate(24 128 90)"/>
  <!-- lengan yang dibasuh (emas), pergelangan kiri -> siku kanan -->
  <path d="M36 52 L116 84" stroke="#C9A227" stroke-width="16" stroke-linecap="round"/>
  <!-- tangan di ujung kiri -->
  <circle cx="28" cy="49" r="10.5" fill="#C9A227"/>
  <circle cx="19" cy="42" r="4" fill="#C9A227"/>
  <circle cx="24" cy="38" r="4" fill="#C9A227"/>
  <circle cx="30" cy="37" r="4" fill="#C9A227"/>
  <!-- lengan pencuci dari bawah -->
  <path d="M104 152 L80 86" stroke="#0B5345" stroke-width="12" stroke-linecap="round"/>
  <!-- tangan pencuci menggenggam lengan emas -->
  <ellipse cx="76" cy="73" rx="12.5" ry="9.5" fill="#06312A" transform="rotate(24 76 73)"/>
  <circle cx="66" cy="64" r="4.5" fill="#06312A"/>
  <!-- air menetes dari lengan -->
  <path d="M52 76 q-3 7 0 10 q3 -3 0 -10Z" fill="#7FB3D5"/>
  <path d="M92 94 q-3 7 0 10 q3 -3 0 -10Z" fill="#7FB3D5"/>
  <path d="M110 100 q-3 7 0 10 q3 -3 0 -10Z" fill="#7FB3D5"/>
  <path d="M68 90 q-2.4 6 0 8.4 q2.4 -2.4 0 -8.4Z" fill="#AED6F1"/>
</svg>
