  <rect x="86" y="60" width="14" height="16" rx="5" fill="#0B5345"/>
  <circle cx="94" cy="50" r="16" fill="#0B5345"/>
  <!-- hidung emas di tepi wajah -->
  <circle cx="79" cy="55" r="4.6" fill="#C9A227"/>
  <!-- lengan di depan badan -->
  <path d="M82 118 Q66 104 62 90" fill="none" stroke="#0B5345" stroke-width="10.5" stroke-linecap="round"/>
  <!-- tangan menadah emas tepat di bawah hidung -->
  <path d="M50 76 Q66 92 82 76 Q78 89 66 89 Q54 89 50 76 Z" fill="#C9A227"/>
  <ellipse cx="66" cy="78" rx="13" ry="3.6" fill="#AED6F1"/>
